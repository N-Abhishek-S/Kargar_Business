<!doctype html>
<html lang="en">
  <head>
    <!-- Google Tag (gtag.js) Initialization -->
    <script type="module">
      const gaId = import.meta.env.VITE_GA_MEASUREMENT_ID;
      const forceAnalytics = import.meta.env.VITE_FORCE_ANALYTICS === 'true';
      const isProd = import.meta.env.PROD;
      const debugMode = import.meta.env.VITE_GA_DEBUG_MODE === 'true';
      
      if ((isProd || forceAnalytics) && gaId) {
        const script = document.createElement('script');
        script.async = true;
        script.src = `https://www.googletagmanager.com/gtag/js?id=${gaId}`;
        // Insert as early as possible in head
        document.head.insertBefore(script, document.head.firstChild);

        window.dataLayer = window.dataLayer || [];
        window.gtag = function gtag(){window.dataLayer.push(arguments);}
        window.gtag('js', new Date());
        window.gtag('config', gaId, { 
          send_page_view: false, // Handled manually by React Router SPA logic
          debug_mode: debugMode
        });
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A1628" />
    <meta name="description" content="Kargar is a trusted integrated facility management company delivering housekeeping, security, and maintenance services for corporate offices across India." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="google-site-verification" content="google52b4520149821fa9" />
    <!-- <meta name="msvalidate.01" content="" /> Bing verification — add token when Bing Webmaster Tools is set up -->

    <!-- Open Graph / Twitter fallback for pre-hydration crawlers and deep links that don't execute JS.
         SEO.tsx (react-helmet-async) overrides these with real per-page values after hydration —
         this is a homepage-only safety net, not accurate per-page social preview data (see docs/SEO_ARCHITECTURE.md). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kargar Facility Management" />
    <meta property="og:title" content="Kargar Facility Management — India's Trusted FM Partner" />
    <meta property="og:description" content="Kargar is a trusted integrated facility management company delivering housekeeping, security, and maintenance services for corporate offices across India." />
    <meta property="og:image" content="https://www.kargarbusinessservices.com/images/brand/kargar-logo.png" />
    <meta property="og:url" content="https://www.kargarbusinessservices.com/" />
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Kargar Facility Management — India's Trusted FM Partner" />
    <meta property="twitter:description" content="Kargar is a trusted integrated facility management company delivering housekeeping, security, and maintenance services for corporate offices across India." />
    <meta property="twitter:image" content="https://www.kargarbusinessservices.com/images/brand/kargar-logo.png" />

    <!-- Preload critical font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/images/brand/kargar-logo.png" />
    <link rel="apple-touch-icon" href="/images/brand/kargar-logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />

    <title>Kargar Facility Management — India's Trusted FM Partner</title>
  </head>
  <body>
    <div id="root"></div>

  </body>
</html>
